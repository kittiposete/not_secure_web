<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Security Lab{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-hover: rgba(30, 41, 59, 0.9);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --border: rgba(255,255,255,0.1);
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            display: flex;
        }
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.8);
            border-right: 1px solid var(--border);
            padding: 2rem 1rem;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .main-content {
            flex-grow: 1;
            margin-left: 260px;
            padding: 2rem 3rem;
            min-height: 100vh;
        }
        .sidebar-brand { font-size: 1.5rem; font-weight: 800; padding: 0 1rem 2rem 1rem; color: white; text-decoration: none; }
        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        .card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            color: white;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
        }
        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.6); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); box-shadow: none; }
        .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-weight: 500; }
        .alert-error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .alert-success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 600; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .badge { background: rgba(99, 102, 241, 0.2); color: #818cf8; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% if session.get('user_id') %}
    <div class="sidebar">
        <a href="{{ url_for('dashboard') }}" class="sidebar-brand">SecLab v2.0</a>
        <a href="{{ url_for('dashboard') }}" class="nav-link">Dashboard</a>
        <a href="{{ url_for('todos') }}" class="nav-link">To-Do List</a>
        <a href="{{ url_for('inbox') }}" class="nav-link">Inbox</a>
        <a href="{{ url_for('users_list') }}" class="nav-link">User Directory</a>
        <a href="{{ url_for('settings') }}" class="nav-link">Settings</a>
        <a href="{{ url_for('help_center') }}" class="nav-link">Help Center</a>
        <div style="flex-grow: 1;"></div>
        <a href="{{ url_for('logout') }}" class="nav-link" style="color: var(--danger);">Logout</a>
    </div>
    {% endif %}
    <div class="main-content" {% if not session.get('user_id') %}style="margin-left: 0; display: flex; align-items: center; justify-content: center;"{% endif %}>
        {% block content %}{% endblock %}
    </div>
</body>
</html>

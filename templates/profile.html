{% extends 'base.html' %}
{% block title %}User Profile{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 2rem;">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold;">
            {{ user[1][0] | upper }}
        </div>
        <div>
            <h2 style="margin: 0; margin-bottom: 5px;">{{ user[1] }}</h2>
            <span class="badge">User #{{ user[0] }}</span>
        </div>
    </div>
    
    <div style="margin-bottom: 2rem;">
        <h3 style="color: var(--text-muted); font-size: 1rem; margin-bottom: 10px;">About</h3>
        <!-- INTENTIONAL XSS: | safe bypasses Jinja escaping -->
        <div style="padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--border);">
            {{ user[3] | safe if user[3] else "No bio provided." }}
        </div>
    </div>
    
    <div style="display: flex; gap: 10px;">
        <a href="{{ url_for('inbox') }}?compose_to={{ user[1] }}" class="btn">Send Message</a>
        <a href="{{ url_for('users_list') }}" class="btn btn-outline">Back to Directory</a>
    </div>
</div>
{% endblock %}
